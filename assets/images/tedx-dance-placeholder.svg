  <text x="350" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FF5C47" text-anchor="middle" letter-spacing="2">DANCE &amp; STAGE PERFORMANCE</text>
  <text x="350" y="340" font-family="'Plus Jakarta Sans', monospace" font-size="11" fill="#9DA2B0" text-anchor="middle">[ REPLACE WITH ACTUAL DANCE / STAGE / WINNING TROPHY PHOTO ]</text>
