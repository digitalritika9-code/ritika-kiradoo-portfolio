      <stop offset="0%" stop-color="#241416" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C47" />
      <stop offset="100%" stop-color="#D4FF32" />
    </linearGradient>
  </defs>
  <rect width="700" height="450" fill="url(#tedxGrad)" rx="12" />
  <rect x="25" y="25" width="650" height="400" fill="none" stroke="url(#goldGlow)" stroke-width="1.5" stroke-dasharray="6 6" rx="8" opacity="0.6" />

  <!-- Trophy & Stage Silhouette -->
